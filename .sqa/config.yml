config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/im-oaipmh-client:
      branch: main
      repo: https://github.com/grycap/im-oaipmh-client/
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/im-oaipmh-client git:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-carmine-havanese.sh
        container: qc.acc_jumpy-cerulean-tarsier
  QC.Doc:
    repos:
      github.com/grycap/im-oaipmh-client find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-gold-toad.sh
        container: qc.doc_shaky-cardinal-jackal
      github.com/grycap/im-oaipmh-client git:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-azure-bee.sh
        container: qc.doc_smelly-viridian-quokka
      github.com/grycap/im-oaipmh-client markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-xanthic-newfoundland.sh
        container: qc.doc_crappy-lavender-discus
  QC.Lic:
    repos:
      github.com/grycap/im-oaipmh-client licensee:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-brown-wasp.sh
        container: qc.lic_snoopy-white-hound
  QC.Met:
    repos:
      github.com/grycap/im-oaipmh-client validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-crimson-saola.sh
        container: qc.met_sleazy-tan-mist
  QC.Sec:
    repos:
      github.com/grycap/im-oaipmh-client bandit:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-wheat-cuttlefish.sh
        container: qc.sec_flabby-seashell-nightingale
  QC.Sty:
    repos:
      github.com/grycap/im-oaipmh-client flake8:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-cinnabar-russel.sh
        container: qc.sty_homely-periwinkle-fossa
      github.com/grycap/im-oaipmh-client jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-aqua-okapi.sh
        container: qc.sty_scanty-auburn-markhor
  QC.Uni:
    repos:
      github.com/grycap/im-oaipmh-client pytest:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-corn-whippet.sh
        container: qc.uni_homely-peach-cichlid
  QC.Ver:
    repos:
      github.com/grycap/im-oaipmh-client get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.muggy-jade-chamois.sh
        container: qc.ver_snippy-chestnut-impala
timeout: 5400
